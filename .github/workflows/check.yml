name: Checagem de precos

on:
  schedule:
    # Belem e UTC-3 o ano inteiro (sem horario de verao).
    #
    # MANHA: 09:00 UTC = 06:00 em Belem, dentro da janela 05:00-09:00 e com 3h
    # de folga para o atraso do cron do GitHub. Dia-do-mes */2 => dias impares.
    - cron: "0 9 */2 * *"
    #
    # NOITE: cobre 20:00-23:00 em Belem = 23:00-02:00 UTC. Dispara todo dia,
    # mas o codigo so executa na vespera do reset de creditos e enquanto
    # houver saldo - nos outros dias sai calado, sem gastar nada.
    - cron: "0 23,0,1,2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Janela a respeitar"
        type: choice
        default: manual
        options: [manual, morning, evening]

# Duas execucoes nunca podem escrever no banco ao mesmo tempo. Nao cancelamos a
# que ja esta rodando: ela pode ja ter gasto credito e estar prestes a gravar.
concurrency:
  group: checagem-precos
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Necessario para o commit de keepalive no fim.
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[turso]"

      - name: Conferir secrets
        # Falha cedo e dizendo QUAL secret falta. Sem isso o erro e um
        # "exit code 2" mudo, que nao distingue nome errado de valor vazio.
        # Imprime so presenca e tamanho - nunca o valor.
        env:
          GECKOAPI_KEY: ${{ secrets.GECKOAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          faltando=0
          for nome in GECKOAPI_KEY DISCORD_WEBHOOK_URL TURSO_DATABASE_URL TURSO_AUTH_TOKEN; do
            valor="${!nome}"
            if [ -z "$valor" ]; then
              echo "FALTANDO -> $nome"
              faltando=1
            else
              echo "ok       -> $nome (${#valor} caracteres)"
            fi
          done
          if [ "$faltando" -eq 1 ]; then
            echo
            echo "Cadastre em Settings > Secrets and variables > Actions,"
            echo "na aba 'Secrets' (nao 'Variables'), como 'New repository secret'"
            echo "(nao 'New environment secret'). Os nomes sao case-sensitive."
            exit 1
          fi

      - name: Rodar checagem
        env:
          GECKOAPI_KEY: ${{ secrets.GECKOAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # Disparo manual usa o modo escolhido; agendado, o cron da manha e
          # o unico com */2, entao qualquer outro e da noite.
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 9 */2 * *' && 'morning' || 'evening') }}
        run: |
          echo "Modo: $MODE"
          python -m src.main once --mode "$MODE"

      - name: Registrar execucao
        # Roda mesmo se a checagem falhar: o objetivo e manter o agendamento
        # vivo. O GitHub desativa workflows agendados apos 60 dias sem
        # atividade no repositorio, e com o banco remoto nada mais commita.
        if: always()
        env:
          RESULTADO: ${{ job.status }}
        run: |
          mkdir -p data
          {
            echo "# Historico de execucoes"
            echo
            echo "Ultima: $(date -u '+%Y-%m-%d %H:%M UTC') - status: ${RESULTADO}"
            echo
            echo "Os precos ficam no Turso; este arquivo existe so para manter"
            echo "o agendamento ativo e dar um rastro legivel das execucoes."
          } > data/last-run.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-run.md
          git diff --staged --quiet || git commit -m "chore: execucao ${RESULTADO} em $(date -u '+%Y-%m-%d')"
          git push
