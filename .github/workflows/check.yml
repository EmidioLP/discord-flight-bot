name: Checagem de precos

on:
  schedule:
    # 12:00 UTC = 09:00 em Belem (UTC-3, sem horario de verao).
    # Dia-do-mes */2 => dias impares = no maximo 16 execucoes/mes. Com o KAYAK
    # cada checagem custa 5 creditos (uma request), entao 16 x 5 = 80, dentro
    # dos 100 do plano free e com folga para retries.
    - cron: "0 12 */2 * *"
  # Permite disparar na mao pela aba Actions (gasta 10 creditos).
  workflow_dispatch:

# Duas execucoes nunca podem escrever no banco ao mesmo tempo. Nao cancelamos a
# que ja esta rodando: ela pode ja ter gasto credito e estar prestes a gravar.
concurrency:
  group: checagem-precos
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Necessario para o commit de keepalive no fim.
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[turso]"

      - name: Conferir secrets
        # Falha cedo e dizendo QUAL secret falta. Sem isso o erro e um
        # "exit code 2" mudo, que nao distingue nome errado de valor vazio.
        # Imprime so presenca e tamanho - nunca o valor.
        env:
          GECKOAPI_KEY: ${{ secrets.GECKOAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          faltando=0
          for nome in GECKOAPI_KEY DISCORD_WEBHOOK_URL TURSO_DATABASE_URL TURSO_AUTH_TOKEN; do
            valor="${!nome}"
            if [ -z "$valor" ]; then
              echo "FALTANDO -> $nome"
              faltando=1
            else
              echo "ok       -> $nome (${#valor} caracteres)"
            fi
          done
          if [ "$faltando" -eq 1 ]; then
            echo
            echo "Cadastre em Settings > Secrets and variables > Actions,"
            echo "na aba 'Secrets' (nao 'Variables'), como 'New repository secret'"
            echo "(nao 'New environment secret'). Os nomes sao case-sensitive."
            exit 1
          fi

      - name: Rodar checagem
        env:
          GECKOAPI_KEY: ${{ secrets.GECKOAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m src.main once

      - name: Registrar execucao
        # Roda mesmo se a checagem falhar: o objetivo e manter o agendamento
        # vivo. O GitHub desativa workflows agendados apos 60 dias sem
        # atividade no repositorio, e com o banco remoto nada mais commita.
        if: always()
        env:
          RESULTADO: ${{ job.status }}
        run: |
          mkdir -p data
          {
            echo "# Historico de execucoes"
            echo
            echo "Ultima: $(date -u '+%Y-%m-%d %H:%M UTC') - status: ${RESULTADO}"
            echo
            echo "Os precos ficam no Turso; este arquivo existe so para manter"
            echo "o agendamento ativo e dar um rastro legivel das execucoes."
          } > data/last-run.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-run.md
          git diff --staged --quiet || git commit -m "chore: execucao ${RESULTADO} em $(date -u '+%Y-%m-%d')"
          git push
