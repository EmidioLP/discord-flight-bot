name: Testes

# Rodar os testes a cada push evita subir codigo quebrado que so falharia na
# proxima checagem agendada - e cada falha dessas custa creditos da GeckoAPI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[dev]"

      # Nenhum secret aqui: os testes usam SQLite em memoria e a API mockada.
      - run: pytest
